<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Bead Battle Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: arena page. Toolbar with your name; lobby list of battles; a battle shows the turn order strip,
   one panel per player with their fighters, the action bar for whoever is up, and the battle log. */
:root {
  --bg: #e9ebf0; --surface: #ffffff; --surface-2: #f3f4f8; --ink: #1b2030; --muted: #5c6374; --line: #d5d9e2;
  --accent: #d63a72; --accent-ink: #ffffff; --peg: rgba(27,32,48,.07); --shadow: 0 10px 30px rgba(20,24,36,.18);
  --good: #1f8a4c; --warn: #c17a00; --bad: #c8322b; --good-bg: #e2f4ea;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-steel: #6b7a90; --t-crystal: #2f8fd8; --t-energy: #c99a00; --t-nature: #2e9b4f; --t-redstone: #d23b2f;
  --t-storm: #3a5bd9; --t-shadow: #5b3f8f; --t-heart: #e0457b; --t-mob: #4c8a2a;
  --s0: #d63a72; --s1: #2f7fd8; --s2: #1f9a5a; --s3: #c27c00; --s4: #7a4fc9; --s5: #0f9aa8;
  --chip-ink: #ffffff;
  --arena-bg: #d9e0ec; --arena-bg2: #f3f5fa; --arena-line: rgba(27,32,48,.22); --arena-wedge: rgba(214,58,114,.22); --arena-dot: rgba(27,32,48,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13151b; --surface: #1c1f28; --surface-2: #232733; --ink: #e9ecf3; --muted: #a2a9b9; --line: #323746;
    --accent: #f06a98; --accent-ink: #1a0b12; --peg: rgba(255,255,255,.05); --shadow: 0 10px 30px rgba(0,0,0,.5);
    --good: #6fd69a; --warn: #f2b25e; --bad: #f27166; --good-bg: #173325;
    --t-steel: #9aa9bf; --t-crystal: #5fb2f0; --t-energy: #e7c13d; --t-nature: #57c477; --t-redstone: #f0675b;
    --t-storm: #7d95f2; --t-shadow: #a487d6; --t-heart: #f27aa3; --t-mob: #83c25d;
    --s0: #f06a98; --s1: #63a6f2; --s2: #4fcf88; --s3: #f0b44a; --s4: #ad8cf0; --s5: #3fd0dc;
    --chip-ink: #111318;
    --arena-bg: #1a1f2b; --arena-bg2: #0e1117; --arena-line: rgba(255,255,255,.2); --arena-wedge: rgba(240,106,152,.26); --arena-dot: rgba(255,255,255,.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13151b; --surface: #1c1f28; --surface-2: #232733; --ink: #e9ecf3; --muted: #a2a9b9; --line: #323746;
  --accent: #f06a98; --accent-ink: #1a0b12; --peg: rgba(255,255,255,.05); --shadow: 0 10px 30px rgba(0,0,0,.5);
  --good: #6fd69a; --warn: #f2b25e; --bad: #f27166; --good-bg: #173325;
  --t-steel: #9aa9bf; --t-crystal: #5fb2f0; --t-energy: #e7c13d; --t-nature: #57c477; --t-redstone: #f0675b;
  --t-storm: #7d95f2; --t-shadow: #a487d6; --t-heart: #f27aa3; --t-mob: #83c25d;
  --s0: #f06a98; --s1: #63a6f2; --s2: #4fcf88; --s3: #f0b44a; --s4: #ad8cf0; --s5: #3fd0dc;
  --chip-ink: #111318;
  --arena-bg: #1a1f2b; --arena-bg2: #0e1117; --arena-line: rgba(255,255,255,.2); --arena-wedge: rgba(240,106,152,.26); --arena-dot: rgba(255,255,255,.08);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--peg) 2.2px, transparent 2.6px);
  background-size: 14px 14px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: relative; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 10px; }
.top h1 { font-size: 24px; }
.top h1 button { all: unset; cursor: pointer; }
.top .spacer { flex: 1 1 auto; }
.me { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.me input { width: 150px; max-width: 40vw; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.status { font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
a.btn { text-decoration: none; color: inherit; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.danger { color: var(--bad); }

main { padding-block: 20px 48px; display: grid; gap: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }

/* Lobby */
.field { display: grid; gap: 4px; }
.field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field input, .field select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); width: 100%; }
form.create { display: grid; gap: 12px; }
form.create h2 { font-size: 20px; }
.battles { display: grid; gap: 10px; }
.lobby { display: grid; gap: 26px; max-width: 900px; margin: 0 auto; width: 100%; }
.lobby > .rules { margin-top: -14px; padding: 12px 16px; }
.lsec { display: grid; gap: 10px; min-width: 0; }
.lhead { display: flex; align-items: center; gap: 10px; }
.lhead h2 { font-size: 22px; }
.lhead .count { font-size: 12px; font-weight: 800; min-width: 24px; text-align: center; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.yourturn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: bob 1.2s ease-in-out infinite; }
.pill.winner { border-color: var(--sc); }
.pill.winner .dot { background: var(--sc); }
.past .battle-item { padding: 10px 14px; }
.past h3 { font-size: 16px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; }
.create-card { padding: 16px 18px; }
.create-note { margin: 0; font-size: 13px; }
@media (min-width: 760px) {
  form.create { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; align-items: end; column-gap: 12px; }
  form.create h2, form.create .create-note, form.create .err { grid-column: 1 / -1; }
  form.create .create-go { height: 40px; }
}
.battle-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.battle-item h3 { font-size: 18px; }
.battle-item .players { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.pill.live { border-color: var(--good); color: var(--good); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sc, var(--muted)); flex: none; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

/* Battle header */
.bhead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.bhead h2 { font-size: 28px; }
.seats { display: flex; flex-wrap: wrap; gap: 8px; }
.seat { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--sc); background: var(--surface); }
.seat b { font-weight: 700; }
.seat-name { width: 130px; max-width: 40vw; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.seat .you { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sc); }

/* Turn order */
.order { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; align-items: center; }
.order .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.oslot { flex: none; display: grid; justify-items: center; gap: 2px; padding: 4px; border-radius: 8px; border: 2px solid transparent; background: var(--surface); font-size: 10px; width: 64px; }
.oslot.now { border-color: var(--sc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 25%, transparent); }
.oslot.done { opacity: .35; }
.oslot span { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Field */
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.team { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--sc); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.team h3 { font-size: 18px; display: flex; gap: 8px; align-items: center; }
.team h3 .you { font-family: var(--font-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sc); }
.unit { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); position: relative; text-align: left; width: 100%; }
.unit.active { border-color: var(--sc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 25%, transparent); }
.unit.ko { opacity: .4; filter: grayscale(1); }
.unit.targetable { cursor: pointer; border-style: dashed; border-color: var(--accent); }
.unit.targetable:hover { background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
.unit .nm { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.unit .sub { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 3px; }
.hp { margin-top: 6px; display: grid; gap: 2px; }
.hpbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); transition: width .4s ease; }
.hpbar i.mid { background: var(--warn); } .hpbar i.low { background: var(--bad); }
.hp small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.type { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--chip-ink); background: var(--tc, var(--muted)); white-space: nowrap; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.tag.bad { color: var(--bad); border-color: currentColor; }
.tag.up { color: var(--good); } .tag.down { color: var(--bad); }
.unit .tgt { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 700; color: var(--accent); }

/* Picture crops */
.thumb { display: block; background-repeat: no-repeat; background-color: var(--surface); border-radius: 6px; margin: 0 auto; }
.thumb.none { display: grid; place-items: center; color: var(--muted); font-size: 10px; border: 1px dashed var(--line); }

/* Action bar */
.moves { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.move { text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; gap: 4px; }
.move[aria-pressed="true"] { border-color: var(--accent); }
.move:disabled { opacity: .5; cursor: default; }
.move b { font-size: 15px; }
.move .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.move .eff { font-size: 13px; }
.hint { font-size: 14px; font-weight: 600; }

/* Log */
.log { max-height: 420px; overflow: auto; display: grid; gap: 2px; font-size: 13.5px; }
.log div { padding: 2px 0; }
.log .round { font-family: var(--font-display); font-size: 15px; margin-top: 8px; color: var(--muted); }
.log .move { all: unset; display: block; font-weight: 700; padding-top: 4px; }
.log .ko { color: var(--bad); font-weight: 700; }
.log .win { font-family: var(--font-display); font-size: 18px; color: var(--accent); }
.log .heal { color: var(--good); }
.log .ab { color: var(--t-shadow); }
.log .miss { color: var(--muted); font-style: italic; }

/* Draft */
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pcard { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; align-items: start; }
.pcard .nm { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.pcard .stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.pcard details { font-size: 12.5px; margin-top: 4px; }
.pcard details summary { cursor: pointer; color: var(--muted); }
.pcard .pickbtn { margin-top: 6px; }
.picks { display: grid; gap: 8px; }
.banner { background: var(--surface); border: 2px solid var(--sc, var(--accent)); border-radius: 12px; padding: 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.banner h2 { font-size: 30px; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.err { color: var(--bad); font-size: 13px; }
details.rules summary { cursor: pointer; font-weight: 600; }
details.rules ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.pcard.cant { opacity: .55; }
.matchup { font-size: 12px; color: var(--muted); margin-top: 3px; }
.typechart summary { cursor: pointer; font-weight: 700; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 14px; margin-top: 10px; }
.trow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.trow .arrow { font-size: 12px; color: var(--muted); }
.trow .who { display: inline-flex; gap: 3px; margin-left: auto; }
.move.maxmove { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
.move.maxmove b { font-family: var(--font-display); font-size: 17px; color: var(--accent); }
.tag.maxtag { color: var(--accent); border-color: currentColor; }
.log .maxline { color: var(--accent); }
.unit { overflow: visible; }
.float { position: absolute; right: 12px; top: -6px; font-family: var(--font-display); font-size: 22px; font-weight: 700; pointer-events: none; animation: floatup 1.1s ease-out forwards; }
.float.dmg { color: var(--bad); } .float.heal { color: var(--good); }
@keyframes floatup { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-28px); opacity: 0; } }
.unit.hit { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
#pop { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 30; }
.popmsg { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 8vw, 72px); padding: 8px 24px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); border: 3px solid currentColor; animation: popin 1.3s ease-out forwards; text-align: center; max-width: calc(100vw - 32px); }
.popmsg.ko { color: var(--bad); } .popmsg.crit { color: var(--warn); } .popmsg.super { color: var(--good); }
.popmsg.miss { color: var(--muted); } .popmsg.max, .popmsg.win { color: var(--accent); }
@keyframes popin { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.08); opacity: 1; } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.seats.compact .seat { padding: 4px 10px; font-size: 14px; }
.meta .short { display: none; }
.turnbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border: 2px solid var(--sc); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.tb-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; }
.tb-name { font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.tb-sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tb-sub .dot { background: var(--sc); }
.tb-wait { margin: 0; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.steps li { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.steps li.on { background: var(--sc); border-color: var(--sc); color: var(--chip-ink); }
.steps li.done { color: var(--ink); }
.tb-step2 { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tb-hint { font-size: 13px; color: var(--muted); }
.move .impact { font-size: 12.5px; font-weight: 700; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.hpbar { display: flex; }
.hpbar i.proj { background: repeating-linear-gradient(135deg, var(--bad) 0 4px, color-mix(in srgb, var(--bad) 35%, transparent) 4px 8px); }
.pv { margin-top: 6px; display: grid; gap: 3px; font-size: 13px; }
.pv-main b { font-size: 14px; }
.pv-badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.badge.ko { color: var(--bad); } .badge.ko.maybe { color: var(--warn); }
.badge.good { color: var(--good); } .badge.weak { color: var(--muted); }
.pv-notes { font-size: 11.5px; color: var(--muted); }
@media (max-width: 640px) {
  /* Top bar: one tight row, not pinned, so the game gets the screen */
  .top { position: static; }
  .top .wrap { gap: 6px 8px; padding-block: 8px; }
  .top h1 { font-size: 19px; width: 100%; }
  .top .spacer { display: none; }
  .me { flex: 1 1 auto; min-width: 0; }
  .me label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .me input { width: 100%; max-width: none; }
  .status { font-size: 12px; }
  main { padding-block: 12px 32px; gap: 16px; }
  /* Lobby: existing battles first */
  .bhead h2 { font-size: 22px; }
  .seats { gap: 6px; }
  .seat-name { width: 110px; }
  /* Field: compact fighter cards */
  .field-grid { gap: 10px; }
  .team { padding: 8px; gap: 6px; }
  .team h3 { font-size: 15px; flex-wrap: wrap; }
  .unit { grid-template-columns: 46px minmax(0,1fr); gap: 8px; padding: 6px 8px; }
  .unit .nm { font-size: 14px; }
  .unit .sub { gap: 3px; margin-top: 2px; }
  .hp { margin-top: 4px; }
  .hpbar { height: 6px; }
  .tag { font-size: 10px; padding: 0 4px; }

  // ---------- data ----------
  // Outside claude.ai the page keeps everything in this browser (pass-and-play on one device).
  // It offers the same small Firestore-style API the page uses: collection/doc, get/set/update/delete,
  // orderBy/limit, onSnapshot and acquire. Swap this for a real backend to play across devices elsewhere.
  function localDb(seed) {
    const KEY = "bead-battle-local-db";
    let data = null;
    try { data = JSON.parse(localStorage.getItem(KEY)); } catch {}
    if (!data || typeof data !== "object") data = { fighters: {}, battles: {} };
    if (seed && !Object.keys(data.fighters || {}).length) data.fighters = seed;
    const clone = x => JSON.parse(JSON.stringify(x));
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
    const listeners = [];
    const meta = { fromCache: false, hasPendingWrites: false };
    const snap = (name, q) => {
      let docs = Object.entries(data[name] || {}).map(([id, d]) => ({ id, exists: true, data: () => clone(d), metadata: meta }));
      if (q.ob) docs.sort((a, b) => ((a.data()[q.ob] ?? 0) - (b.data()[q.ob] ?? 0)) * (q.dir === "desc" ? -1 : 1));
      if (q.lim) docs = docs.slice(0, q.lim);
      return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] };
    };
    const fire = name => listeners.filter(l => l.name === name).forEach(l => setTimeout(() => l.next(snap(name, l.q)), 0));
    window.addEventListener("storage", e => { if (e.key === KEY) { try { data = JSON.parse(e.newValue) || data; } catch {} fire("fighters"); fire("battles"); } });
    const coll = (name, q = {}) => ({
      orderBy: (field, dir = "asc") => coll(name, Object.assign({}, q, { ob: field, dir })),
      limit: n => coll(name, Object.assign({}, q, { lim: n })),
      get: async () => snap(name, q),
      onSnapshot(next) { const l = { name, q, next }; listeners.push(l); setTimeout(() => next(snap(name, q)), 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; },

          acquire: async () => ({ acquired: true }),
          get: async () => { const d = (data[name] || {})[id]; return { id, exists: !!d, data: () => d ? clone(d) : undefined, metadata: meta }; },
          set: async body => { (data[name] = data[name] || {})[id] = clone(body); save(); fire(name); },
          update: async body => { Object.assign(data[name][id], clone(body)); save(); fire(name); },
          delete: async () => { if (data[name]) delete data[name][id]; save(); fire(name); } };
      },
    });
    return { collection: name => coll(name) };
  }

    if (!myId) { myId = store.get("bb-device") || ("d" + Math.random().toString(36).slice(2, 10)); store.set("bb-device", myId); }
    try { if (user && await user.canEdit()) canWrite = "admin"; } catch {}
    const timer = setTimeout(() => { status.textContent = "Can't reach the battles yet. Still trying…"; }, 10000);
    let firstF = false, firstB = false;
    const ready = () => { if (firstF && firstB) { clearTimeout(timer); status.textContent = localMode ? (fighters.length ? "On this device" : "No fighters loaded") : "Live"; } };
    db.collection("fighters").onSnapshot(snap => {
      fighters = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      fightersLoaded = true;
      if (!snap.metadata.fromCache) { firstF = true; ready(); }
      render();
    }, e => { clearTimeout(timer); status.textContent = "Fighters stopped loading. Reload the page."; });
    db.collection("battles").orderBy("created", "desc").limit(300).onSnapshot(snap => {
      battles = snap.docs.map(d => d.data()).filter(b => b && b.id);
      battlesLoaded = true;
      if (!snap.metadata.fromCache) { firstB = true; ready(); }
      render();
    }, e => { clearTimeout(timer); battlesLoaded = true; status.textContent = e.code === "revoked" ? "No longer available" : "Battles stopped updating. Reload the page."; render(); });
  })();
})();
</script>
